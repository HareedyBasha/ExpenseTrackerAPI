definitions:
  dto.DepositRequest:
    properties:
      amount:
        example: 1000
        type: integer
      category:
        example: salary
        type: string
      note:
        example: Don't spend too much!
        type: string
    required:
    - amount
    type: object
  dto.Error400:
    properties:
      error:
        example: Invalid request body
        type: string
    type: object
  dto.Error401:
    properties:
      error:
        example: missing claims
        type: string
    type: object
  dto.Error403:
    properties:
      error:
        example: user not authorized to view this wallet
        type: string
    type: object
  dto.Error404:
    properties:
      error:
        example: username not found in records
        type: string
    type: object
  dto.Error422Transfer:
    properties:
      error:
        example: cannot transfer to self
        type: string
    type: object
  dto.Error422Withdraw:
    properties:
      error:
        example: insufficient funds
        type: string
    type: object
  dto.Error500:
    properties:
      error:
        example: failed to query database
        type: string
    type: object
  dto.TransferRequest:
    properties:
      amount:
        example: 10000
        type: integer
      category:
        example: Tips
        type: string
      note:
        example: You earned it!
        type: string
      to_user:
        example: Adam
        type: string
    required:
    - amount
    - to_user
    type: object
  dto.Wallet200Response:
    properties:
      balance:
        example: 20000
        type: integer
      user_id:
        example: 3
        type: integer
    type: object
  dto.WithdrawRequest:
    properties:
      amount:
        example: 500
        type: integer
      category:
        example: food
        type: string
      note:
        example: to buy chicken
        type: string
    required:
    - amount
    type: object
  handler.CategorySummary:
    properties:
      category:
        type: string
      count:
        type: integer
      total:
        type: integer
    type: object
  handler.SummaryResult:
    properties:
      categories:
        items:
          $ref: '#/definitions/handler.CategorySummary'
        type: array
      period:
        example: 2026-08
        type: string
      total:
        example: 20000
        type: integer
    type: object
  model.Transaction:
    properties:
      amount:
        type: integer
      category:
        type: string
      created_at:
        example: "2026-08-13T22:08:50.997585+03:00"
        type: string
      id:
        example: 4
        type: integer
      note:
        type: string
      related_wallet_id:
        type: integer
      type:
        type: string
      updated_at:
        example: "2026-08-13T22:08:50.997585+03:00"
        type: string
      wallet_id:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for wallet and transaction management with JWT auth and RBAC.
  title: ExpenseTracker API
  version: "1.0"
paths:
  /transactions:
    get:
      description: Shows user's transactions with optional filters like category and
        from and to dates, where the displayed amount is determined by page and limit
      parameters:
      - description: Which page of the transactions list to show
        in: query
        name: page
        type: integer
      - description: How many transactions to show in each page
        in: query
        name: limit
        type: integer
      - description: Which category of transactions to show (case-insensitive)
        in: query
        name: category
        type: string
      - description: Which date to start showing transactions after in RFC3339
        in: query
        name: from
        type: string
      - description: Which date to start showing transactions before in RFC3339
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Transaction'
            type: array
        "400":
          description: failed to parse a query param
          schema:
            $ref: '#/definitions/dto.Error400'
        "401":
          description: invalid authorization
          schema:
            $ref: '#/definitions/dto.Error401'
        "500":
          description: failed to correctly query the database or parse claims
          schema:
            $ref: '#/definitions/dto.Error500'
      security:
      - BearerAuth: []
      summary: Retrieves user's transactions
      tags:
      - transaction
  /transactions/summary:
    get:
      description: Shows user's transactions grouped by category and formatted to
        be concise and nice to read
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SummaryResult'
        "400":
          description: failed to parse a query param
          schema:
            $ref: '#/definitions/dto.Error400'
        "401":
          description: invalid authorization
          schema:
            $ref: '#/definitions/dto.Error401'
        "500":
          description: failed to correctly query the database or parse claims
          schema:
            $ref: '#/definitions/dto.Error500'
      security:
      - BearerAuth: []
      summary: Retrieves a summary of user's transactions
      tags:
      - transaction
  /wallet:
    get:
      description: Shows user's wallet's balance and user id or another user's wallet
        if the issuer is an admin and inputs an id as a query parameter
      parameters:
      - description: User's id if admin wants to query another user's wallet
        in: query
        name: id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Wallet200Response'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/dto.Error400'
        "401":
          description: invalid authorization
          schema:
            $ref: '#/definitions/dto.Error401'
        "403":
          description: user not authorized to view this wallet
          schema:
            $ref: '#/definitions/dto.Error403'
        "404":
          description: inputted username not found in database
          schema:
            $ref: '#/definitions/dto.Error404'
        "500":
          description: failed to correctly query the database or parse claims
          schema:
            $ref: '#/definitions/dto.Error500'
      security:
      - BearerAuth: []
      summary: Retrieves user's wallet info
      tags:
      - wallet
  /wallet/deposit:
    post:
      consumes:
      - application/json
      description: Takes inputted amount and adds it to wallet's balance
      parameters:
      - description: Deposit payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DepositRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Wallet200Response'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/dto.Error400'
        "401":
          description: invalid authorization header
          schema:
            $ref: '#/definitions/dto.Error401'
        "500":
          description: failed to correctly query the database or parse claims
          schema:
            $ref: '#/definitions/dto.Error500'
      security:
      - BearerAuth: []
      summary: Deposit funds to wallet
      tags:
      - wallet
  /wallet/transfer:
    post:
      consumes:
      - application/json
      description: Takes inputted amount from user's wallet and transfers it to another
        user's wallet
      parameters:
      - description: Transfer payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TransferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Wallet200Response'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/dto.Error400'
        "401":
          description: invalid authorization header
          schema:
            $ref: '#/definitions/dto.Error401'
        "404":
          description: inputted username not found in database
          schema:
            $ref: '#/definitions/dto.Error404'
        "422":
          description: cannot transfer to self
          schema:
            $ref: '#/definitions/dto.Error422Transfer'
        "500":
          description: failed to correctly query the database or parse claims
          schema:
            $ref: '#/definitions/dto.Error500'
      security:
      - BearerAuth: []
      summary: Transfers funds between users
      tags:
      - wallet
  /wallet/withdraw:
    post:
      consumes:
      - application/json
      description: Takes inputted amount and subtracts it from wallet's balance
      parameters:
      - description: Withdraw payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.WithdrawRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Wallet200Response'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/dto.Error400'
        "401":
          description: invalid authorization header
          schema:
            $ref: '#/definitions/dto.Error401'
        "422":
          description: not enough balance to withdraw
          schema:
            $ref: '#/definitions/dto.Error422Withdraw'
        "500":
          description: failed to correctly query the database or parse claims
          schema:
            $ref: '#/definitions/dto.Error500'
      security:
      - BearerAuth: []
      summary: Withdraws funds from wallet
      tags:
      - wallet
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and your JWT.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
